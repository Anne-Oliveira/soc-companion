spring:
  application:
    name: soc-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:soc}
    username: ${POSTGRES_USER:soc_user}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  ingest:
    api-key: ${INGEST_API_KEY}
